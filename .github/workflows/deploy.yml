name: Production deploy with verification and rollback

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact full commit SHA on main to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trg-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact authorized source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - name: Verify exact source identity and current main tip
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.source_commit }}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "${{ inputs.source_commit }}"
          test "$(git rev-parse origin/main)" = "${{ inputs.source_commit }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:measurement-contract
      - name: Verify live Cloudflare Zaraz consent configuration
        env:
          CLOUDFLARE_ZARAZ_READ_TOKEN: ${{ secrets.CLOUDFLARE_ZARAZ_READ_TOKEN }}
          CLOUDFLARE_ZONE_ID: 7102a31aa58d6acf0145f56f0fb6463d
        run: npm run verify:consent:release
      - name: Build exact release candidate
        env:
          PUBLIC_RELEASE_COMMIT: ${{ inputs.source_commit }}
          PUBLIC_RELEASE_BRANCH: main
        run: npm run build

      - name: Capture last-known-good production deployment
        id: last_known_good
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "deployment_id=$(node scripts/post-deploy-safety.mjs capture)" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloudflare Pages
        id: deploy_pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=torontorestaurantgrowth --branch=main --commit-hash=${{ inputs.source_commit }} --commit-dirty=false

      - name: Resolve exact successful production deployment ID
        id: deployed
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          for attempt in {1..12}; do
            if ! curl --fail-with-body --silent --show-error \
              --output "$response" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/torontorestaurantgrowth"; then
              sleep 5
              continue
            fi
            if ! jq -e '.success == true' "$response" >/dev/null; then
              sleep 5
              continue
            fi
            project="$(jq -r '.result.name // empty' "$response")"
            production_branch="$(jq -r '.result.production_branch // empty' "$response")"
            deployment_id="$(jq -r '.result.canonical_deployment.id // empty' "$response")"
            deployment_environment="$(jq -r '.result.canonical_deployment.environment // empty' "$response")"
            deployment_status="$(jq -r '.result.canonical_deployment.latest_stage.status // empty' "$response")"
            deployment_branch="$(jq -r '.result.canonical_deployment.deployment_trigger.metadata.branch // empty' "$response")"
            deployment_sha="$(jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash // empty' "$response")"
            deployment_dirty="$(jq -r '.result.canonical_deployment.deployment_trigger.metadata | if has("commit_dirty") then (.commit_dirty | tostring) else empty end' "$response")"
            if [[ "$project" == torontorestaurantgrowth &&
                  "$production_branch" == main &&
                  -n "$deployment_id" &&
                  "$deployment_environment" == production &&
                  "$deployment_status" == success &&
                  "$deployment_branch" == main &&
                  "$deployment_sha" == "${{ inputs.source_commit }}" &&
                  "$deployment_dirty" == false ]]; then
              echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"
              echo "Cloudflare canonical production identity matches the exact clean candidate."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for the exact clean production deployment identity" >&2
          exit 1

      - name: Verify production critically
        id: production_verify
        shell: bash
        run: |
          set -euo pipefail
          node scripts/post-deploy-safety.mjs verify --expected-commit=${{ inputs.source_commit }}
          echo "verification_status=passed" >> "$GITHUB_OUTPUT"
          echo "verified_at=$(node -p 'new Date().toISOString()')" >> "$GITHUB_OUTPUT"

      - name: Roll back to last-known-good deployment
        id: rollback
        if: ${{ failure() && steps.deploy_pages.outcome == 'success' && (steps.deployed.outcome == 'failure' || steps.production_verify.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/post-deploy-safety.mjs rollback --deployment-id=${{ steps.last_known_good.outputs.deployment_id }}

      - name: Verify restored production
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        run: node scripts/post-deploy-safety.mjs verify --profile=baseline

      - name: Send exact verified release receipt to Forge dashboard
        id: release_receipt
        if: ${{ steps.production_verify.outcome == 'success' }}
        continue-on-error: true
        env:
          RELEASE_RECEIPT_SECRET: ${{ secrets.RELEASE_RECEIPT_SECRET }}
          RELEASE_CANDIDATE_SHA: ${{ inputs.source_commit }}
          RELEASE_DEPLOYMENT_ID: ${{ steps.deployed.outputs.deployment_id }}
          RELEASE_VERIFIED_AT: ${{ steps.production_verify.outputs.verified_at }}
          RELEASE_VERIFICATION_STATUS: ${{ steps.production_verify.outputs.verification_status }}
          RELEASE_RECEIPT_OUTPUT: artifacts/release-receipt-sender.json
        run: node scripts/release-receipt-sender.mjs

      - name: Retain Forge dashboard release sender receipt
        id: release_receipt_artifact
        if: ${{ always() && steps.production_verify.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trg-forge-release-receipt-${{ inputs.source_commit }}
          path: artifacts/release-receipt-sender.json
          if-no-files-found: error
          retention-days: 90

      - name: Warn without rolling back a dashboard receipt failure
        if: ${{ always() && (steps.release_receipt.outcome == 'failure' || steps.release_receipt_artifact.outcome == 'failure') }}
        shell: bash
        run: echo "::warning title=Dashboard release receipt failed::Production verification passed, so the healthy release was retained. Inspect the sanitized sender receipt artifact when available."

      - name: Submit canonical release URLs to IndexNow
        id: indexnow_submit
        if: ${{ steps.production_verify.outcome == 'success' }}
        continue-on-error: true
        env:
          RELEASE_COMMIT: ${{ inputs.source_commit }}
        run: npm run indexnow:submit -- --receipt=artifacts/indexnow-receipt.json

      - name: Upload IndexNow submission receipt
        if: ${{ always() && steps.production_verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: trg-indexnow-${{ inputs.source_commit }}
          path: artifacts/indexnow-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Alert without rolling back a healthy release
        if: ${{ steps.indexnow_submit.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning title=IndexNow submission failed::Production verification passed, so the healthy release was retained. Review the trg-indexnow receipt artifact and retry submission."
          {
            echo "### IndexNow follow-up required"
            echo "- Production verification passed; no rollback was requested."
            echo "- IndexNow submission failed; inspect the receipt artifact and retry."
          } >> "$GITHUB_STEP_SUMMARY"
