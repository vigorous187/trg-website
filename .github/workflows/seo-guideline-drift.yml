name: SEO guideline drift (monthly)

on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compare guideline fingerprints
        id: drift
        run: node scripts/seo-check-guideline-baseline.mjs
        continue-on-error: true
      - name: Open issue on drift
        if: steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="SEO: Google guideline page changed — review checklist"
          open=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$open" ]; then
            echo "Open issue #$open already tracks guideline drift. Skipping duplicate."
            exit 0
          fi
          gh issue create \
            --title "$title" \
            --body "Monthly guideline fingerprint check failed. Review logs in this workflow run. Update docs/BLOG_PIPELINE_GOOGLE_CHECKLIST.md and repo gate scripts only when a live page changed a rule this repo enforces; run npm run seo:guidelines:init and commit automation/guideline-baseline.json." \
            || true
